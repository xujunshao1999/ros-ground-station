# 地面站后端配置

# ============================================================
# MQTT Broker
# ============================================================
broker_host: "localhost"
broker_port: 1883

# ============================================================
# Web 服务
# ============================================================
api_host: "0.0.0.0"
api_port: 8000

# ============================================================
# 机器人管理
# ============================================================

# 心跳超时（秒）
heartbeat_timeout: 30.0

# 每台机器人最多保存的传感器条目数，超限淘汰最旧
max_sensor_entries: 200

# ============================================================
# 告警规则
# ============================================================
alert_rules:
  battery_warning_threshold: 50.0    # 低于此值触发 warning 告警
  battery_critical_threshold: 20.0   # 低于此值触发 error 告警
  position_x_min: -100.0             # 位置 X 下限
  position_x_max: 100.0              # 位置 X 上限
  position_y_min: -100.0             # 位置 Y 下限
  position_y_max: 100.0              # 位置 Y 上限
  debounce_seconds: 300              # 同类型告警防重复间隔（秒）

# ============================================================
# 数据录制
# ============================================================
db_path: "data/recording.db"        # SQLite 数据库文件路径
auto_record: false                    # 是否启动时自动开始录制
recording_interval: 1.0              # 状态采样间隔（秒）

# ============================================================
# MQTT Broker 认证（可选）
# ============================================================
# mqtt_username: ""
# mqtt_password: ""
